[project]
name = "hatile"
description = "Ring Tile trackers from Home Assistant over Bluetooth, without the Tile servers."
authors = [{ name = "Jeremy Tellaa" }]
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[tool.poetry]
# A Home Assistant custom component, not a package: Poetry only manages the
# development environment. Home Assistant provides the runtime dependencies.
package-mode = false

[tool.poetry.group.dev.dependencies]
# Pins homeassistant itself, 2026.10.4 for this version.
pytest-homeassistant-custom-component = "0.13.375"
# Requirements of Home Assistant's bluetooth and usb integrations, which the
# test harness does not install. Keep them at the versions of the
# homeassistant pinned above, from their manifest.json.
aiousbwatcher = "1.1.2"
bleak = "3.0.2"
bleak-retry-connector = "4.7.1"
bluetooth-adapters = "2.4.0"
bluetooth-auto-recovery = "1.6.4"
bluetooth-data-tools = "1.29.24"
dbus-fast = "5.0.22"
habluetooth = "7.1.2"
serialx = "1.11.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
